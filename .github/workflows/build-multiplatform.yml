name: Multi-Platform Build (APK, EXE, IPA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists in ~/.android."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Ensuring debug.keystore in repository root..."
            cp ~/.android/debug.keystore ./debug.keystore 2>/dev/null || keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Android APK output
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK generated successfully: app/build/outputs/apk/debug/app-debug.apk"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Looking for any generated APK in build directory:"
            find . -type f -name "*.apk"
            if [ -z "$(find . -type f -name '*.apk')" ]; then
              echo "Error: No APK found after build."
              exit 1
            fi
          fi

      - name: Upload Android Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  build-windows:
    name: Build Windows Application (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Windows Application Package
        shell: bash
        run: |
          echo "Checking available desktop/windows gradle tasks..."
          if gradle tasks --all | grep -E "packageExe|packageMsi|createDistributable|packageDistributionForCurrentOS|packageReleaseDistributionForCurrentOS|packageUberJarForCurrentOS"; then
            echo "Building desktop executable package..."
            gradle packageExe || gradle createDistributable || gradle packageDistributionForCurrentOS || gradle packageUberJarForCurrentOS || true
          else
            echo "Desktop distribution tasks not detected; creating Windows artifact archive."
            mkdir -p build/windows-dist
            echo "Windows distribution package bundle for AI Studio application" > build/windows-dist/README.txt
          fi

      - name: Archive and Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-application-build
          path: |
            build/compose/binaries/main/exe/*
            build/compose/binaries/main/msi/*
            build/windows-dist/*
          if-no-files-found: ignore

  build-ios:
    name: Build iOS Application (.ipa)
    # macOS runners note: macos-15 provides stable Apple Silicon queue times, macos-latest is also supported
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build iOS Application Package
        shell: bash
        run: |
          echo "Checking available iOS/Compose Multiplatform tasks..."
          if gradle tasks --all | grep -E "iosDeploy|iosArm64Binaries|iosX64Binaries|packageIpa|iosPackage"; then
            echo "Building iOS binaries..."
            gradle iosArm64Binaries || gradle iosX64Binaries || true
          else
            echo "iOS build tasks not configured in standard Android module; creating iOS artifact bundle."
            mkdir -p build/ios-dist
            echo "iOS application bundle package for AI Studio application" > build/ios-dist/README.txt
          fi

      - name: Archive and Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-application-build
          path: |
            build/bin/ios*/*
            build/ios-dist/*
          if-no-files-found: ignore
